name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # 1. SECRET SCANNING (T13) - cegah password/API key bocor ke repo
  secret-scan:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. CODE QUALITY GATE (P11) - Pylint, gagal bila skor < 8
  quality-gate:
    name: 2. Code Quality Gate (Pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pylint app tests --fail-under=8

  # 3. UNIT & SECURITY TEST (T08)
  unit-test:
    name: 3. Unit Test (Pytest)
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -v

  # 4. SAST (P04, T14) - Semgrep analisis kode statis
  sast:
    name: 4. SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/owasp-top-ten --config p/secrets --error --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  # 5. SCA (T12) - cek library pihak ketiga yang punya CVE
  sca:
    name: 5. SCA (pip-audit + Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  # 6. BUILD + CONTAINER SCAN
  container:
    name: 6. Build & Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [secret-scan, unit-test, sast, sca]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devsecops-app:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-app:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # 7. DAST (P08) - OWASP ZAP baseline scan ke aplikasi yang berjalan
  dast:
    name: 7. DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build -t devsecops-app .
          docker run -d -p 5000:5000 -e SECRET_KEY=${{ github.run_id }} --name app devsecops-app
          sleep 5 && curl -f http://localhost:5000/health
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          rules_file_name: .zap-rules.tsv
          allow_issue_writing: false
          fail_action: false
